name: nest-angular-demo

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: /data/chinook.db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in the shell or a root .env file}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./database/data:/data
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
